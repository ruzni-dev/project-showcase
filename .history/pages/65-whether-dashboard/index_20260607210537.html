<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="py-4">
    <div class="container">
        <header class="text-center mb-4">
            <h1 class="display-4 fw-bold text-white"><i class="fas fa-cloud-sun me-2"></i>Weather Dashboard</h1>
            <p class="lead text-white">Check current weather and 5-day forecast for any city</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="input-group mb-4">
                    <input type="text" id="city-input" class="form-control py-2" placeholder="Enter city name...">
                    <button class="btn btn-primary search-btn" id="search-btn">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <button class="btn location-btn ms-2" id="location-btn">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="weather-card p-4 mb-4 text-center">
                    <div id="current-weather">
                        <div class="text-center py-5">
                            <h3>Search for a city to see weather information</h3>
                            <p class="text-muted">Or use your current location</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="text-center text-white mb-3" id="forecast-title" style="display: none;">5-Day Forecast</h3>
        <div class="row justify-content-center" id="forecast-container">
            <!-- Forecast cards will be inserted here -->
        </div>

        <footer class="text-center mt-5">
            <p class="credit">Powered by OpenWeatherMap</p>
        </footer>
    </div>
    
    <script src="assets/js/script.js"></script>
</body>
</html>
