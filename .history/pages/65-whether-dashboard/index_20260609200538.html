<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opulent Weather | Prestige Climate Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container py-4">
        <div class="luxury-header fade-up">
            <div class="crown-icon">
                <i class="fas fa-crown" style="font-size: 3rem; color: #FFD700;"></i>
            </div>
            <h1 class="glow-text">Opulent Weather</h1>
            <p class="luxury-subtitle">✦ Prestige Climate Experience ✦</p>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-md-8 col-lg-6">
                <div class="search-container">
                    <div class="search-weapon" id="searchWeapon">
                        <div class="input-holder">
                            <input type="text" class="search-input" id="city-input" placeholder="Enter destination..."/>
                            <button class="search-icon" id="searchBtn">
                                <span></span>
                            </button>
                        </div>
                        <span class="close" id="closeBtn"></span>
                    </div>
                    <button class="location-btn-fixed" id="location-btn">
                        <i class="fas fa-location-dot"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-lg-10">
                <div class="weather-masterpiece glass-reflection" id="current-weather">
                    <div class="text-center py-5">
                        <i class="fas fa-cloud-sun" style="font-size: 4rem; color: #FFD700; opacity: 0.6;"></i>
                        <h3 class="mt-3" style="color: white;">Awaiting Your Command</h3>
                        <p style="color: rgba(255,255,255,0.6);">Enter a city to reveal the atmosphere's secrets</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="forecast-section" style="display: none;">
            <div class="forecast-section-title">
                <h2>5-Day Forecast</h2>
            </div>
            <div class="row" id="forecast-container"></div>
        </div>

        <div class="luxury-footer">
            <p><i class="fas fa-gem"></i> Opulent Weather Service | Powered by OpenWeatherMap <i class="fas fa-gem"></i></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
