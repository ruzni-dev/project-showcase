<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Contact Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contact-wrapper">
    <div class="contact-left">
      <h2>Get in Touch</h2>
      <p> ruzni2003@gmail.com</p>
      <p> Vavuniya, Sri lanka</p>
      <p> +94 71 864 44513</p>
    </div>
    <div class="contact-right form-right">
      <h2>Contact Us</h2>
      <form id="contactForm" onsubmit="return validateForm()">
        <div class="form-group">
          <input type="text" id="name" required />
          <label for="name">Your Name</label>
          <span id="nameError">Please enter your name.</span>
        </div>
        <div class="form-group">
          <input type="email" id="email" required />
          <label for="email">Your Email</label>
          <span id="emailError">Enter a valid email.</span>
        </div>
        <div class="form-group">
          <textarea id="message" required></textarea>
          <label for="message">Your Message</label>
          <span id="messageError">Message cannot be empty.</span>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
