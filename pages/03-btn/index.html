<body>

    <a href="#" class="btn-8"><i class="fas fa-underline"></i> Swipe</a>
    <a href="#" class="btn-9 rotate-card">Rotate & Shadow</a>

  <div class="btns">
    <button id="btn3">
      <i></i>
