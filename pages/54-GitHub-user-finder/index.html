<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Explorer | Luxury Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">GitHub Explorer</div>
            <div class="tagline">Luxury Edition - Discover Developers in Style</div>
            
            <div class="search-container">
                <input type="text" class="search-box" id="searchInput" placeholder="Enter GitHub username...">
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </header>

        <div class="loading hidden" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Searching GitHub...
        </div>

        <div class="error hidden" id="error"></div>

        <div class="main-content hidden" id="mainContent">
            <div class="profile-card">
                <div class="profile-header">
                    <img src="" alt="Avatar" class="avatar" id="avatar">
                    <div class="user-info">
                        <h1 class="username" id="username"></h1>
                        <p class="bio" id="bio"></p>
                    </div>
                </div>
                
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="reposCount">0</div>
                        <div class="stat-label">Repositories</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="followersCount">0</div>
                        <div class="stat-label">Followers</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="followingCount">0</div>
                        <div class="stat-label">Following</div>
                    </div>
                </div>
            </div>
            
            <div class="repos-container">
                <h2 class="section-title">Repositories</h2>
                <div class="repos-list" id="reposList">
                    <!-- Repositories will be added here -->
                </div>
            </div>
        </div>

        <div class="chart-container hidden" id="chartContainer">
            <h2 class="section-title">Language Distribution</h2>
            <canvas id="languageChart"></canvas>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
