<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Login & Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Circles -->
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <!-- Form Container -->
  <div class="form-container" id="formBox">


    <!-- Login / Signup Forms -->
    <form id="loginForm" class="form active">
         <h2 id="formTitle">Login</h2>
      <input type="text" placeholder="Username" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>

      <div class="social-login">
        <button type="button" class="google-btn">
          <img decoding="async" src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google"> Google
        </button>
        <button type="button" class="facebook-btn">
          <img decoding="async" src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"> Facebook
        </button>
      </div>
        <p>Don't have an account? <a href="#" id="toggleForm">Sign up</a></p>
    </form>

    <form id="signupForm" class="form">
         <h2 id="formTitle">Signup</h2>
      <input type="text" placeholder="Username" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <input type="password" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>

      <div class="social-login">
        <button type="button" class="google-btn">
          <img decoding="async" src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google">  Google
        </button>
        <button type="button" class="facebook-btn">
          <img decoding="async" src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">  Facebook
        </button>
      </div>
      <p>Already have an account? <a href="#" id="toggleFormBack">Login</a></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
